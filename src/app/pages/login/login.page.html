<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container" @fadeIn>
    <div class="logo-section">
      <img src="assets/LogoPetCare.png" alt="PetCare" class="main-logo">
      <p class="tagline">Gestiona tu información y la de tu mascota</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-container">
      <div class="input-group">
        <label class="input-label">Correo</label>
        <mat-form-field appearance="outline" class="custom-field">
          <input matInput placeholder="test@petcare.com" formControlName="email" type="email" />
          <mat-error *ngIf="loginForm.controls.email.hasError('required')">
            El correo es obligatorio.
          </mat-error>
          <mat-error *ngIf="loginForm.controls.email.hasError('email')">
            Ingresa un formato válido.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="input-group">
        <label class="input-label">Contraseña</label>
        <mat-form-field appearance="outline" class="custom-field">
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="1-6"
          />
          <button type="button" matSuffix (click)="togglePassword()" tabindex="-1" class="password-toggle-btn">
            <ion-icon [name]="hidePassword ? 'eye-off' : 'eye'" size="small"></ion-icon>
          </button>
          <mat-error *ngIf="loginForm.controls.password.hasError('required')">
            La contraseña es obligatoria.
          </mat-error>
          <mat-error *ngIf="loginForm.controls.password.hasError('minlength')">
            Debe tener al menos 6 caracteres.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="register-link">
        <span>¿Aún no tienes cuenta ?</span>
        <a routerLink="/register" class="register-text">Registrarme</a>
      </div>

      <ion-button expand="block" type="submit" class="login-button">Ingresar</ion-button>
    </form>
  </div>
</ion-content>
